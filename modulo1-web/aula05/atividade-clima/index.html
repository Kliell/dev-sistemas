<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Consulta de Clima</title>
<style>
body {
text-align: center;
font-family: Arial;
background: linear-gradient(180deg, #4facfe, #00f2fe);
color: white;
min-height: 100vh;
margin: 0;
padding-top: 50px;
transition: background 0.5s ease;
}
select,
button {
padding: 10px;
border-radius: 8px;
margin-top: 10px;
}
#resultado {
margin-top: 20px;
background: rgba(255, 255, 255, 0.2);
padding: 20px;
border-radius: 12px;
display: inline-block;
min-width: 250px;
}
img {
width: 80px;
}
</style>
</head>
<body>
<h1>Consulta de Clima</h1>
<select id="cidade">
<option value="-15.78,-47.93">Brasília</option>
<option value="-23.55,-46.63">São Paulo</option>
<option value="-22.90,-43.20">Rio de Janeiro</option>
</select>
<button id="buscar">Buscar Clima</button>
<div id="resultado"></div>
<script src="script.js"></script>
</body>
</html>
